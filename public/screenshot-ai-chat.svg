  <rect x="30" y="272" width="300" height="180" rx="14" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.05"/>
  <text x="46" y="296" font-family="Arial, sans-serif" font-size="14" fill="#111">Здравствуйте, Анна! 👋</text>
  <text x="46" y="322" font-family="Arial, sans-serif" font-size="14" fill="#111">Для лёгкого освежения к лету</text>
  <text x="46" y="342" font-family="Arial, sans-serif" font-size="14" fill="#111">отлично подойдёт:</text>
  <text x="46" y="372" font-family="Arial, sans-serif" font-size="14" fill="#0088CC">✨ Тонирование — 4500 ₽, 2 часа</text>
  <text x="46" y="396" font-family="Arial, sans-serif" font-size="14" fill="#0088CC">✨ Ботокс для волос — 3500 ₽</text>
  <text x="46" y="428" font-family="Arial, sans-serif" font-size="14" fill="#666">Есть свободное окно в четверг в</text>
  <text x="46" y="448" font-family="Arial, sans-serif" font-size="14" fill="#666">19:00. Записать вас? 💆♀️</text>
  <text x="300" y="446" font-family="Arial, sans-serif" font-size="11" fill="#8A8A8A">14:06</text>
