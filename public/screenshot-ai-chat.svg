  <text x="106" y="497" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">✅ Да, записать</text>
  <rect x="190" y="468" width="140" height="46" rx="12" fill="#FFFFFF" stroke="#0088CC"/>
  <text x="260" y="497" font-family="Arial, sans-serif" font-size="14" fill="#0088CC" text-anchor="middle">Показать ещё</text>
