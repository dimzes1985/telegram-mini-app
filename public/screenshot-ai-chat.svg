  <text x="138" y="172" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">цвет к лету. Что посоветуете?</text>
  <text x="318" y="192" font-family="Arial, sans-serif" font-size="11" fill="#B7E3FA">14:06</text>
