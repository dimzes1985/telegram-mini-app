  <rect x="150" y="530" width="195" height="56" rx="14" fill="#0088CC"/>
  <text x="168" y="552" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Да, запишите меня на</text>
  <text x="168" y="572" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">тонирование в четверг 👍</text>
  <text x="318" y="578" font-family="Arial, sans-serif" font-size="11" fill="#B7E3FA">14:07</text>
  <!-- AI confirmation -->
  <rect x="30" y="602" width="290" height="70" rx="14" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.05"/>
  <text x="46" y="626" font-family="Arial, sans-serif" font-size="14" fill="#111">Готово! Запись подтверждена:</text>
  <text x="46" y="650" font-family="Arial, sans-serif" font-size="14" fill="#0088CC">Чт 21 авг, 19:00 • Тонирование</text>
  <text x="292" y="664" font-family="Arial, sans-serif" font-size="11" fill="#8A8A8A">14:07</text>
  <!-- Input bar -->
  <rect x="16" y="676" width="343" height="68" fill="#FFFFFF" stroke="#E0E0E0"/>
  <rect x="28" y="692" width="300" height="36" rx="18" fill="#F0F0F0"/>
  <text x="44" y="715" font-family="Arial, sans-serif" font-size="14" fill="#999">Сообщение</text>
  <path d="M316 710l18 0-3 12-6-6z" fill="#0088CC"/>
