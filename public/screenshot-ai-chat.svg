  <text x="76" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">Салон красоты «Аврора»</text>
  <text x="76" y="100" font-family="Arial, sans-serif" font-size="12" fill="#7A7A7A">онлайн • ИИ-ассистент</text>
