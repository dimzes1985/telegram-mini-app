<svg width="375" height="760" viewBox="0 0 375 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone frame -->
  <rect x="4" y="4" width="367" height="752" rx="40" fill="#1B1B1F" stroke="#3A3A40" stroke-width="4"/>
  <!-- Screen -->
  <rect x="16" y="16" width="343" height="728" rx="32" fill="#FFFFFF"/>
  <!-- Status bar -->
  <rect x="16" y="16" width="343" height="40" fill="#FFFFFF"/>
  <text x="36" y="42" font-family="Arial, sans-serif" font-size="14" fill="#1B1B1F">9:41</text>
  <!-- Chat header -->
  <rect x="16" y="56" width="343" height="60" fill="#0088CC" fill-opacity="0.06"/>
  <circle cx="50" cy="86" r="18" fill="#0088CC"/>
  <path d="M38 88h24M50 76c-4.5 0-8 3.6-8 8v1h16v-1c0-4.4-3.5-8-8-8z" fill="white"/>
  <text x="76" y="82" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#111">Салон красоты «Аврора»</text>
  <text x="76" y="100" font-family="Arial, sans-serif" font-size="12" fill="#7A7A7A">бот</text>
  <!-- Chat background -->
  <rect x="16" y="116" width="343" height="560" fill="#E6EBF0"/>
  <!-- Bot message -->
  <rect x="30" y="130" width="280" height="180" rx="14" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.05"/>
  <rect x="30" y="310" width="0" height="0" fill="none"/>
  <text x="46" y="152" font-family="Arial, sans-serif" font-size="14" fill="#111">
    <tspan x="46" dy="0">👋 Добро пожаловать в</tspan>
    <tspan x="46" dy="18">Салон красоты «Аврора»!</tspan>
  </text>
  <text x="46" y="196" font-family="Arial, sans-serif" font-size="14" fill="#666">
    <tspan x="46" dy="0">Я могу помочь вам:</tspan>
    <tspan x="46" dy="18">• Узнать об услугах</tspan>
    <tspan x="46" dy="18">• Записаться на прием</tspan>
    <tspan x="46" dy="18">• Получить информацию о бизнесе</tspan>
  </text>
  <text x="46" y="286" font-family="Arial, sans-serif" font-size="14" fill="#111">Как я могу вам помочь?</text>
  <text x="280" y="300" font-family="Arial, sans-serif" font-size="11" fill="#8A8A8A">14:05</text>
  <!-- Inline keyboard -->
  <rect x="30" y="316" width="315" height="46" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text x="188" y="345" font-family="Arial, sans-serif" font-size="14" fill="#0088CC" text-anchor="middle">📋 Наши услуги</text>
  <rect x="30" y="368" width="315" height="46" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text x="188" y="397" font-family="Arial, sans-serif" font-size="14" fill="#0088CC" text-anchor="middle">ℹ️ О бизнесе</text>
  <rect x="30" y="420" width="315" height="46" rx="12" fill="#0088CC"/>
  <text x="188" y="449" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">💬 Задать вопрос</text>
  <!-- User message -->
  <rect x="150" y="480" width="195" height="56" rx="14" fill="#0088CC"/>
  <text x="168" y="502" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Записаться на</text>
  <text x="168" y="522" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">маникюр на завтра</text>
  <text x="318" y="528" font-family="Arial, sans-serif" font-size="11" fill="#B7E3FA">14:06</text>
  <!-- Bot reply -->
  <rect x="30" y="552" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.05"/>
  <text x="46" y="576" font-family="Arial, sans-serif" font-size="14" fill="#111">Свободные окна на завтра:</text>
  <text x="46" y="600" font-family="Arial, sans-serif" font-size="14" fill="#0088CC">10:00 • 12:30 • 15:00 • 18:00</text>
  <text x="46" y="624" font-family="Arial, sans-serif" font-size="14" fill="#666">Нажмите кнопку ниже, чтобы записаться 👇</text>
  <text x="300" y="632" font-family="Arial, sans-serif" font-size="11" fill="#8A8A8A">14:06</text>
  <rect x="30" y="648" width="315" height="46" rx="12" fill="#0088CC"/>
  <text x="188" y="677" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">📅 Открыть приложение для записи</text>
  <!-- Input bar -->
  <rect x="16" y="676" width="343" height="68" fill="#FFFFFF" stroke="#E0E0E0"/>
  <rect x="28" y="692" width="300" height="36" rx="18" fill="#F0F0F0"/>
  <text x="44" y="715" font-family="Arial, sans-serif" font-size="14" fill="#999">Сообщение</text>
  <path d="M316 710l18 0-3 12-6-6z" fill="#0088CC"/>
</svg>
