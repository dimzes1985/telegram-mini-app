# Builds the app and deploys it to the Russian server on every merge to main.
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${{ vars.NEXT_PUBLIC_SENTRY_DSN }}" \
            --build-arg NEXT_PUBLIC_YM_ID="${{ vars.NEXT_PUBLIC_YM_ID }}" \
            -t slot-app:latest .
          docker save slot-app:latest | gzip > slot-app.tar.gz

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload secrets from GitHub
        env:
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          {
            [ -n "$YOOKASSA_SHOP_ID" ] && echo "YOOKASSA_SHOP_ID=$YOOKASSA_SHOP_ID"
            [ -n "$YOOKASSA_SECRET_KEY" ] && echo "YOOKASSA_SECRET_KEY=$YOOKASSA_SECRET_KEY"
            [ -n "$AI_API_KEY" ] && echo "AI_API_KEY=$AI_API_KEY"
            true
          } > secrets.env
          scp -q secrets.env root@${{ vars.DEPLOY_HOST }}:/opt/slot/secrets.env
          rm secrets.env

      - name: Deploy
        run: |
          scp -q slot-app.tar.gz root@${{ vars.DEPLOY_HOST }}:/opt/slot/slot-app.tar.gz
          ssh root@${{ vars.DEPLOY_HOST }} 'set -e
            cd /opt/slot
            chmod 600 secrets.env
            gunzip -c slot-app.tar.gz | docker load
            rm slot-app.tar.gz
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            for i in $(seq 1 30); do
              if docker exec slot-app node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "App is up"; exit 0
              fi
              sleep 2
            done
            docker logs --tail 50 slot-app
            exit 1'
